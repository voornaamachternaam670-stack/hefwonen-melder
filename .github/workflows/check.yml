name: Hef Wonen check

on:
  schedule:
    - cron: '*/10 * * * *'   # elke 10 minuten (GitHub kan een paar minuten uitlopen)
  workflow_dispatch:          # handmatig starten via de Actions-tab

permissions:
  contents: write             # om state.json terug te committen

concurrency:
  group: hefwonen-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aanbod controleren
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node check.js

      - name: State opslaan
        if: always()
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "hefwonen-melder"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "state bijgewerkt"
            git push
          fi
